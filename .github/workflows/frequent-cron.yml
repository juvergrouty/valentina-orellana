name: Frequent cron (reminders + expiración de pagos)

# Vercel Hobby solo permite 1 cron diario por proyecto. Este workflow gratuito
# de GitHub Actions (repos públicos = sin costo) llama a los endpoints que
# necesitan revisarse cada pocos minutos: liberar reservas sin pago a los 30 min,
# y enviar recordatorios con precisión de horas (no solo "el día antes").
#
# Requiere UN secreto de repo (Settings → Secrets and variables → Actions):
#   CRON_SECRET  → el mismo valor que la variable de entorno CRON_SECRET en Vercel.
# OJO: GitHub NO garantiza la frecuencia de los workflows programados; en la
# práctica de este repo corre cada ~4-6 horas, no cada 5 minutos. Para tiempos
# reales usar un pinger externo gratuito (ej. cron-job.org) que llame a estos
# mismos endpoints con el header Authorization: Bearer <CRON_SECRET>.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Expirar reservas sin pago (>30 min)
        run: |
          curl -sS -X GET "https://www.valentinaorellana.cl/api/cron/expire-pending" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

      - name: Recordatorios por email (24h antes)
        run: |
          curl -sS -X GET "https://www.valentinaorellana.cl/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
