name: Avisar a Bing de páginas nuevas o cambiadas (IndexNow)

# 4 nov 2026: cada push a main que toca páginas públicas avisa a Bing (y a los
# demás buscadores que usan IndexNow) qué direcciones cambiaron, para que las
# vuelvan a leer en horas y no en semanas. Google no usa IndexNow.
# La clave es pública por diseño: vive en public/<clave>.txt y solo prueba que
# el sitio es nuestro. Solo se envían direcciones que estén en el mapa del sitio.
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/data/blog.ts'
      - 'src/layouts/BlogPostLayout.astro'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      SITIO: https://www.valentinaorellana.cl
      CLAVE: c429a18f9e83b7d59859d1b97def0c1b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Armar la lista de direcciones cambiadas
        run: |
          set -euo pipefail
          : > candidatas.txt
          antes="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$antes" ] || [ "$antes" = "0000000000000000000000000000000000000000" ]; then
            echo "todas" > modo.txt
            exit 0
          fi
          echo "cambios" > modo.txt
          git diff --name-only "$antes" "${{ github.sha }}" > cambiados.txt
          # Cambió la plantilla o la lista del blog: todos los artículos.
          if grep -qE '^src/(data/blog\.ts|layouts/BlogPostLayout\.astro)$' cambiados.txt; then
            echo "BLOG" >> candidatas.txt
          fi
          { grep -E '^src/pages/.*\.astro$' cambiados.txt || true; } | while read -r f; do
            ruta=${f#src/pages/}; ruta=${ruta%.astro}; ruta=${ruta%/index}; ruta=${ruta%index}
            if [ -z "$ruta" ]; then echo "$SITIO/" >> candidatas.txt; else echo "$SITIO/$ruta" >> candidatas.txt; fi
          done
          cat candidatas.txt

      - name: Esperar a que Vercel publique el cambio (hasta 10 minutos)
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            sleep 20
            clave=$(curl -fsS "$SITIO/$CLAVE.txt" 2>/dev/null || true)
            mapa=$(curl -fsS "$SITIO/sitemap.xml" 2>/dev/null || true)
            [ "$clave" = "$CLAVE" ] || continue
            [ -n "$mapa" ] || continue
            echo "$mapa" | grep -o '<loc>[^<]*</loc>' | sed -e 's#</*loc>##g' > mapa.txt
            faltan=$(grep -v '^BLOG$' candidatas.txt | grep -Fxvf mapa.txt | wc -l || true)
            # Las páginas nuevas aparecen en el mapa solo cuando ya están publicadas.
            [ "$faltan" -eq 0 ] && { echo "Sitio listo"; exit 0; }
          done
          echo "Pasaron 10 minutos; se avisa con lo que ya está publicado"
          [ -s mapa.txt ] || exit 1

      - name: Avisar a IndexNow
        run: |
          set -euo pipefail
          if [ "$(cat modo.txt)" = "todas" ]; then
            cp mapa.txt enviar.txt
          else
            { grep "$SITIO/blog/" mapa.txt || true; } > blog.txt
            { grep -qx 'BLOG' candidatas.txt && cat blog.txt || true; } > extra.txt
            cat candidatas.txt extra.txt | { grep -Fxf mapa.txt || true; } | sort -u > enviar.txt
          fi
          if [ ! -s enviar.txt ]; then echo "Nada que avisar"; exit 0; fi
          cat enviar.txt

          lista=$(jq -R . enviar.txt | jq -s .)
          cuerpo=$(jq -n --arg host "${SITIO#https://}" --arg key "$CLAVE" \
            --arg loc "$SITIO/$CLAVE.txt" --argjson urls "$lista" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}')
          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$cuerpo")
          echo "IndexNow respondió $codigo"; cat respuesta.txt || true
          case "$codigo" in 200|202) ;; *) exit 1 ;; esac
